name: Build Nocturne Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Studio SoundFont (.sf2) & FluidSynth Prebuilts
        run: |
          mkdir -p app/src/main/assets
          # Download high-definition multi-sampled piano & instrument SoundFont
          sudo apt-get update
          sudo apt-get install -y fluid-soundfont-gm wget unzip
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 app/src/main/assets/nocturne_studio.sf2

      - name: Setup Gradle & Build APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Nocturne APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Piano-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
