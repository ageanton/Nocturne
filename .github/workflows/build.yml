name: Build Nocturne Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Studio SoundFont (.sf2) & TinySoundFont Header
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/cpp
          sudo apt-get update
          sudo apt-get install -y fluid-soundfont-gm curl
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 app/src/main/assets/nocturne_studio.sf2
          curl -L https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h -o app/src/main/cpp/tsf.h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compile Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Nocturne APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Piano-APK
          path: app/build/outputs/apk/debug/app-debug.apk
