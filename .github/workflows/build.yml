name: Build Nocturne Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify & Auto-Fix Project Folder Structure
        run: |
          echo "=== Current Repository Files ==="
          find . -maxdepth 5 -not -path '*/.*'
          
          # Ensure exact directories exist
          mkdir -p app/src/main/java/com/nocturne/piano
          mkdir -p app/src/main/cpp
          mkdir -p app/src/main/assets
          
          # If MainActivity.kt, CMakeLists.txt, or native-lib.cpp were placed in slightly wrong folders, move them automatically
          find . -name "MainActivity.kt" -exec cp {} app/src/main/java/com/nocturne/piano/MainActivity.kt \; || true
          find . -name "CMakeLists.txt" -exec cp {} app/src/main/cpp/CMakeLists.txt \; || true
          find . -name "native-lib.cpp" -exec cp {} app/src/main/cpp/native-lib.cpp \; || true
          find . -name "AndroidManifest.xml" -exec cp {} app/src/main/AndroidManifest.xml \; || true

      - name: Accept Android SDK Licenses & Install NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch Studio SoundFont (.sf2) & TinySoundFont Header
        run: |
          sudo apt-get update
          sudo apt-get install -y fluid-soundfont-gm timgm6mb-soundfont curl
          # Use FluidR3 if under memory limit, fallback cleanly
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 app/src/main/assets/nocturne_studio.sf2 || cp /usr/share/sounds/sf2/TimGM6mb.sf2 app/src/main/assets/nocturne_studio.sf2
          curl -f -L https://raw.githubusercontent.com/schellingb/TinySoundFont/master/tsf.h -o app/src/main/cpp/tsf.h

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --no-daemon --console=plain

      - name: Upload Nocturne APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-Piano-APK
          path: app/build/outputs/apk/debug/app-debug.apk
